<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10243a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="A320 Questions">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon.svg">
    <title>A320 · Technical Questions</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; background: #10243a; color: #f5f8fc; padding-top: env(safe-area-inset-top); }
      header { flex: 0 0 auto; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #ffffff20; }
      header > a { margin-left: auto; color: #062d37; background: #20b6a8; border-radius: 9px; padding: 9px 11px; font-size: 12px; font-weight: 700; text-decoration: none; white-space: nowrap; }
      .mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: #20b6a8; color: #062d37; font-weight: 800; }
      h1 { margin: 0; font-size: 15px; line-height: 1.2; font-weight: 650; }
      .subtitle { margin-top: 3px; color: #b6c4d2; font-size: 11px; }
      main { flex: 1; min-height: 0; position: relative; background: #e7ebef; }
      iframe { width: 100%; height: 100%; border: 0; display: block; background: #e7ebef; }
      .fallback { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px; text-align: center; color: #10243a; background: #e7ebef; }
      .fallback p { margin: 0; max-width: 280px; line-height: 1.45; }
      a.button { display: inline-block; padding: 12px 18px; border-radius: 12px; color: #062d37; background: #20b6a8; font-weight: 700; text-decoration: none; }
      footer { flex: 0 0 auto; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); text-align: center; color: #b6c4d2; font-size: 10px; }
    </style>
  </head>
  <body>
    <header>
      <div class="mark" aria-hidden="true">A3</div>
      <div><h1>A320 Technical Questions</h1><div class="subtitle">Documento de consulta</div></div>
      <a href="A320%20-%20technical%20questions%20-%20apr26.pdf" target="_blank" rel="noopener">Abrir PDF</a>
    </header>
    <main>
      <iframe title="A320 technical questions PDF" src="A320%20-%20technical%20questions%20-%20apr26.pdf">
        <div class="fallback"><p>Seu navegador não abriu o PDF nesta tela.</p><a class="button" href="A320%20-%20technical%20questions%20-%20apr26.pdf">Abrir documento</a></div>
      </iframe>
      <div class="fallback" id="fallback" hidden><p>Se o PDF não aparecer, abra o documento diretamente.</p><a class="button" href="A320%20-%20technical%20questions%20-%20apr26.pdf">Abrir documento</a></div>
    </main>
    <footer>Use os controles do PDF para buscar, ampliar e navegar.</footer>
    <script>
      const frame = document.querySelector('iframe');
      frame.addEventListener('error', () => { document.querySelector('#fallback').hidden = false; });
    </script>
  </body>
</html>
