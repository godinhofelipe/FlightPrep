<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10243a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="A320 Questions">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon.svg">
    <title>A320 Technical Questions</title>
    <style>
      :root { color-scheme: light; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 17px; }
      * { box-sizing: border-box; }
      html { background: #f3f6f8; scroll-behavior: smooth; }
      body { margin: 0; color: #15263a; background: #f3f6f8; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: var(--reader-size, 17px); line-height: 1.58; -webkit-text-size-adjust: 100%; }
      header { position: sticky; top: 0; z-index: 5; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: #10243a; color: #f5f8fc; box-shadow: 0 3px 12px #10243a30; }
      .topline { display: flex; align-items: center; gap: 11px; max-width: 820px; margin: 0 auto; }
      .mark { flex: 0 0 36px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; background: #20b6a8; color: #062d37; font-size: 13px; font-weight: 800; }
      .heading { min-width: 0; flex: 1; }
      h1 { margin: 0; font-size: 16px; line-height: 1.2; font-weight: 700; }
      .subtitle { margin-top: 3px; color: #b6c4d2; font-size: 11px; line-height: 1.25; }
      .pdf-link { flex: 0 0 auto; padding: 8px 10px; border: 1px solid #ffffff50; border-radius: 9px; color: #fff; font-size: 12px; font-weight: 600; text-decoration: none; }
      .toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; max-width: 820px; margin: 9px auto 0; }
      .toolbar-label { margin-right: auto; color: #b6c4d2; font-size: 12px; }
      .size-button { min-width: 39px; min-height: 34px; padding: 3px 8px; border: 1px solid #ffffff50; border-radius: 9px; background: #1c344d; color: #fff; font: 600 15px "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .size-button:active, .pdf-link:active { background: #20b6a8; color: #062d37; }
      main { width: min(100%, 820px); margin: 0 auto; padding: 12px 14px 32px; }
      #status { padding: 24px 8px; text-align: center; color: #536579; }
      .page { margin: 0 0 12px; padding: 14px 16px 18px; border: 1px solid #e0e6eb; border-radius: 14px; background: #fff; box-shadow: 0 2px 8px #10243a08; }
      .page-label { margin-bottom: 10px; color: #7890a3; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h2 { margin: 19px 0 8px; color: #10243a; font-size: 1.16em; line-height: 1.3; font-weight: 700; }
      .page > h2:first-of-type { margin-top: 0; }
      p { margin: 0 0 10px; }
      ul { margin: 4px 0 12px; padding-left: 1.3em; }
      li { margin: 0 0 5px; padding-left: 2px; }
      .table-wrap { margin: 8px 0 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { width: 100%; border-collapse: collapse; font-size: .86em; line-height: 1.4; }
      th, td { padding: 8px 7px; border: 1px solid #d9e2e8; text-align: left; vertical-align: top; }
      th { background: #eaf2f5; color: #18364b; font-weight: 700; }
      footer { padding: 0 14px calc(18px + env(safe-area-inset-bottom)); color: #718297; text-align: center; font-size: 12px; }
      @media (max-width: 520px) {
        main { padding: 10px 9px 24px; }
        .page { padding: 12px 13px 16px; border-radius: 12px; }
        .table-wrap { overflow: visible; }
        table, tbody, tr, td { display: block; width: 100%; }
        thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
        tr { margin-bottom: 8px; border: 1px solid #d9e2e8; border-radius: 9px; overflow: hidden; }
        td { display: grid; grid-template-columns: minmax(92px, 34%) 1fr; gap: 8px; padding: 7px 9px; border: 0; border-bottom: 1px solid #e8edf0; }
        td:last-child { border-bottom: 0; }
        td::before { content: attr(data-label); color: #587084; font-weight: 700; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="topline">
        <div class="mark" aria-hidden="true">A3</div>
        <div class="heading"><h1>A320 Technical Questions</h1><div class="subtitle">Leitura adaptada · 11 páginas</div></div>
        <a class="pdf-link" href="A320%20-%20technical%20questions%20-%20apr26.pdf" target="_blank" rel="noopener">PDF original</a>
      </div>
      <div class="toolbar" role="group" aria-label="Tamanho do texto">
        <span class="toolbar-label">Tamanho do texto</span>
        <button class="size-button" id="smaller" type="button" aria-label="Diminuir fonte">A−</button>
        <button class="size-button" id="reset" type="button" aria-label="Restaurar fonte padrão">A</button>
        <button class="size-button" id="larger" type="button" aria-label="Aumentar fonte">A+</button>
      </div>
    </header>
    <main id="reader"><div id="status">Carregando conteúdo…</div></main>
    <footer>O botão “PDF original” abre o arquivo fonte.</footer>
    <script>
      const reader = document.querySelector('#reader');
      const status = document.querySelector('#status');
      const defaultSize = 17;
      let size = Number(localStorage.getItem('a320-reader-size')) || defaultSize;
      const setSize = value => {
        size = Math.max(13, Math.min(30, value));
        document.documentElement.style.setProperty('--reader-size', `${size}px`);
        localStorage.setItem('a320-reader-size', String(size));
        document.querySelector('#reset').textContent = `${size}`;
        document.querySelector('#reset').setAttribute('aria-label', `Fonte em ${size} pixels; restaurar padrão`);
      };
      document.querySelector('#smaller').addEventListener('click', () => setSize(size - 1));
      document.querySelector('#larger').addEventListener('click', () => setSize(size + 1));
      document.querySelector('#reset').addEventListener('click', () => setSize(defaultSize));
      setSize(size);

      const make = (tag, text, parent) => { const el = document.createElement(tag); el.textContent = text; parent.append(el); return el; };
      const isHeading = line => /[A-Z]/.test(line) && line === line.toLocaleUpperCase('en') && line.length < 90 && !/[.!?]$/.test(line) && !/^[●○]/.test(line);
      const renderPage = (raw, index, total, tableData) => {
        const section = document.createElement('section');
        section.className = 'page';
        section.setAttribute('aria-label', `Página ${index + 1}`);
        make('div', `Página ${index + 1} de ${total}`, section).className = 'page-label';
        let lines = raw.split(/\r?\n/);
        lines = lines.filter(line => line.trim() !== 'AIRBUS A320 - TECHNICAL QUESTIONS' && !/^\d+\/\d+$/.test(line.trim()));
        let list = null, paragraph = null, inPrecisionTable = false, tableInserted = false;
        const flushParagraph = () => { if (paragraph) { make('p', paragraph.trim(), section); paragraph = null; } };
        const stopList = () => { list = null; };
        const addPrecisionTable = () => {
          if (tableInserted || !tableData) return;
          flushParagraph(); stopList();
          const wrap = document.createElement('div'); wrap.className = 'table-wrap';
          const table = document.createElement('table');
          const thead = document.createElement('thead'); const header = document.createElement('tr');
          tableData[0].forEach(value => make('th', value.replace(/\n/g, ' '), header));
          thead.append(header); table.append(thead);
          const tbody = document.createElement('tbody');
          tableData.slice(1).forEach(row => {
            const tr = document.createElement('tr');
            row.forEach((value, col) => { const td = make('td', value.replace(/\n/g, ' '), tr); td.dataset.label = tableData[0][col]; });
            tbody.append(tr);
          });
          table.append(tbody); wrap.append(table); section.append(wrap); tableInserted = true;
        };
        for (const original of lines) {
          const line = original.trim();
          if (!line) { flushParagraph(); stopList(); continue; }
          if (index === 0 && line === 'PRECISION APPROACH MINIMUMS') inPrecisionTable = true;
          if (index === 0 && inPrecisionTable && line === 'COMMUNICATION LOSS') { addPrecisionTable(); inPrecisionTable = false; }
          if (index === 0 && inPrecisionTable && line !== 'PRECISION APPROACH MINIMUMS') continue;
          if (isHeading(line)) { flushParagraph(); stopList(); make('h2', line, section); continue; }
          const bullet = line.match(/^([●○])\s*(.*)$/);
          if (bullet) {
            flushParagraph();
            if (!list) { list = document.createElement('ul'); section.append(list); }
            make('li', bullet[2], list); continue;
          }
          if (list && list.lastElementChild) { list.lastElementChild.textContent += ` ${line}`; continue; }
          stopList(); paragraph = paragraph ? `${paragraph} ${line}` : line;
        }
        flushParagraph();
        return section;
      };
      fetch('./content.json').then(response => { if (!response.ok) throw new Error('content unavailable'); return response.json(); }).then(data => {
        reader.replaceChildren();
        data.pages.forEach((page, index) => reader.append(renderPage(page, index, data.pages.length, index === 0 ? data.precisionTable : null)));
      }).catch(() => { status.textContent = 'Não foi possível carregar o texto. Atualize a página ou abra o PDF original.'; });
    </script>
  </body>
</html>
