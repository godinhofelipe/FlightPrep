<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10243a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flight Briefing">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon.svg">
    <title>A320 Flight Briefing</title>
    <style>
      :root { color-scheme: light; --reader-size: 17px; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      * { box-sizing: border-box; }
      html { background: #f3f6f8; scroll-behavior: smooth; }
      body { margin: 0; color: #15263a; background: #f3f6f8; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: var(--reader-size); line-height: 1.5; -webkit-text-size-adjust: 100%; }
      header { position: sticky; top: 0; z-index: 5; padding: calc(10px + env(safe-area-inset-top)) 16px 0; background: #10243a; color: #f5f8fc; box-shadow: 0 3px 12px #10243a30; }
      .topline { display: flex; align-items: center; gap: 11px; max-width: 820px; margin: 0 auto; }
      .mark { flex: 0 0 36px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; background: #20b6a8; color: #062d37; font-size: 13px; font-weight: 800; }
      h1 { margin: 0; font-size: 16px; line-height: 1.2; font-weight: 700; }
      .subtitle { margin-top: 3px; color: #b6c4d2; font-size: 11px; line-height: 1.25; }
      .toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; max-width: 820px; margin: 9px auto 10px; }
      .toolbar-label { margin-right: auto; color: #b6c4d2; font-size: 12px; }
      .size-button { min-width: 39px; min-height: 34px; padding: 3px 8px; border: 1px solid #ffffff50; border-radius: 9px; background: #1c344d; color: #fff; font: 600 15px "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .size-button:active { background: #20b6a8; color: #062d37; }
      nav { display: flex; max-width: 820px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
      nav::-webkit-scrollbar { display: none; }
      .tab { flex: 0 0 auto; min-height: 42px; padding: 10px 14px 9px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #b6c4d2; font: 700 12px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .06em; }
      .tab[aria-selected="true"] { border-bottom-color: #20b6a8; color: #fff; }
      main { width: min(100%, 820px); margin: 0 auto; padding: 14px 14px 34px; }
      .phase-title { margin: 2px 2px 12px; color: #10243a; font-size: 1.2em; line-height: 1.3; }
      .group-title { margin: 18px 2px 8px; color: #3c6075; font-size: .78em; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
      .field-card { margin: 0 0 10px; padding: 12px; border: 1px solid #e0e6eb; border-radius: 13px; background: #fff; box-shadow: 0 2px 8px #10243a08; }
      .field-label { display: block; margin: 0 0 7px; color: #17334a; font-size: .9em; font-weight: 700; }
      .checkline { display: flex; align-items: center; gap: 10px; min-height: 28px; margin-bottom: 8px; }
      .checkline label { color: #17334a; font-size: 1em; font-weight: 750; }
      .check-card.check-only .checkline { margin-bottom: 0; }
      input[type="checkbox"] { width: 22px; height: 22px; margin: 0; accent-color: #138c82; }
      textarea { display: block; width: 100%; min-height: 108px; padding: 10px 11px; resize: vertical; border: 1px solid #d7e0e6; border-radius: 9px; outline: none; background: #fbfcfd; color: #15263a; font: 400 1em/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; }
      textarea:focus { border-color: #138c82; box-shadow: 0 0 0 3px #20b6a820; }
      .check-card textarea { min-height: 82px; }
      .save-status { min-height: 18px; margin: 5px 3px 0; color: #718297; text-align: right; font-size: 11px; }
      footer { padding: 0 14px calc(18px + env(safe-area-inset-bottom)); color: #718297; text-align: center; font-size: 11px; }
      @media (max-width: 520px) { main { padding: 12px 9px 28px; } .field-card { padding: 11px; } }
    </style>
  </head>
  <body>
    <header>
      <div class="topline">
        <div class="mark" aria-hidden="true">A3</div>
        <div><h1>A320 Flight Briefing</h1><div class="subtitle">Briefing notes</div></div>
      </div>
      <div class="toolbar" role="group" aria-label="Text size">
        <span class="toolbar-label">Text size</span>
        <button class="size-button" id="smaller" type="button" aria-label="Decrease text size">A−</button>
        <button class="size-button" id="reset" type="button" aria-label="Reset text size">A</button>
        <button class="size-button" id="larger" type="button" aria-label="Increase text size">A+</button>
      </div>
      <nav role="tablist" aria-label="Flight phases">
        <button class="tab" id="tab-flight-preparation" type="button" role="tab" aria-selected="true" aria-controls="flight-preparation">FLIGHT PREPARATION</button>
      </nav>
    </header>
    <main>
      <section id="flight-preparation" role="tabpanel" aria-labelledby="tab-flight-preparation">
        <h2 class="phase-title">FLIGHT PREPARATION</h2>
        <h3 class="group-title">Technical</h3>
        <div class="field-card check-card">
          <div class="checkline"><input id="oeb-check" type="checkbox" data-save="oeb-check"><label for="oeb-check">OEB</label></div>
          <textarea aria-label="OEB notes" data-save="oeb-notes"></textarea>
        </div>
        <div class="field-card check-card">
          <div class="checkline"><input id="mel-check" type="checkbox" data-save="mel-check"><label for="mel-check">MEL</label></div>
          <textarea aria-label="MEL notes" data-save="mel-notes"></textarea>
        </div>
        <h3 class="group-title">Briefing items</h3>
        <div class="field-card"><label class="field-label" for="route">Route</label><textarea id="route" aria-label="Route notes" data-save="route"></textarea></div>
        <div class="field-card check-card">
          <div class="checkline"><input id="weather-check" type="checkbox" data-save="weather-check"><label for="weather-check">Weather</label></div>
          <textarea aria-label="Weather notes" data-save="weather-notes"></textarea>
        </div>
        <div class="field-card check-card">
          <div class="checkline"><input id="notam-check" type="checkbox" data-save="notam-check"><label for="notam-check">NOTAM</label></div>
          <textarea aria-label="NOTAM notes" data-save="notam-notes"></textarea>
        </div>
        <h3 class="group-title">Company Procedures</h3>
        <div class="field-card check-card check-only"><div class="checkline"><input id="pbn" type="checkbox" data-save="pbn"><label for="pbn">PBN</label></div></div>
        <div class="field-card check-card check-only"><div class="checkline"><input id="rvsm" type="checkbox" data-save="rvsm"><label for="rvsm">RVSM</label></div></div>
        <div class="field-card check-card check-only"><div class="checkline"><input id="ipa" type="checkbox" data-save="independent-parallel-approach"><label for="ipa">Independent Parallel Approach</label></div></div>
        <div class="field-card check-card">
          <div class="checkline"><input id="company-others" type="checkbox" data-save="company-others"><label for="company-others">Others</label></div>
          <textarea aria-label="Other company procedures" data-save="company-others-notes"></textarea>
        </div>
        <h3 class="group-title">Load &amp; Fuel</h3>
        <div class="field-card check-card">
          <div class="checkline"><input id="pax" type="checkbox" data-save="pax"><label for="pax">PAX</label></div>
          <textarea aria-label="PAX notes" data-save="pax-notes"></textarea>
        </div>
        <div class="field-card check-card">
          <div class="checkline"><input id="weight-limit" type="checkbox" data-save="weight-limit"><label for="weight-limit">Weight Limit</label></div>
          <textarea aria-label="Weight Limit notes" data-save="weight-limit-notes"></textarea>
        </div>
        <div class="field-card check-card">
          <div class="checkline"><input id="underload" type="checkbox" data-save="underload"><label for="underload">Underload</label></div>
          <textarea aria-label="Underload notes" data-save="underload-notes"></textarea>
        </div>
        <div class="field-card check-card">
          <div class="checkline"><input id="refueling" type="checkbox" data-save="refueling"><label for="refueling">Refueling</label></div>
          <textarea aria-label="Refueling notes" data-save="refueling-notes"></textarea>
        </div>
        <div class="field-card check-card">
          <div class="checkline"><input id="to-fuel" type="checkbox" data-save="to-fuel"><label for="to-fuel">TO Fuel</label></div>
          <textarea aria-label="TO Fuel notes" data-save="to-fuel-notes"></textarea>
        </div>
        <div class="field-card check-card">
          <div class="checkline"><input id="ldg-fuel" type="checkbox" data-save="ldg-fuel"><label for="ldg-fuel">LDG Fuel</label></div>
          <textarea aria-label="LDG Fuel notes" data-save="ldg-fuel-notes"></textarea>
        </div>
        <div class="save-status" id="save-status" aria-live="polite">Notes are saved on this device.</div>
      </section>
    </main>
    <footer>Your notes stay in this browser on this device.</footer>
    <script>
      const defaultSize = 17;
      let size = Number(localStorage.getItem('a320-briefing-size')) || defaultSize;
      const setSize = value => {
        size = Math.max(13, Math.min(30, value));
        document.documentElement.style.setProperty('--reader-size', `${size}px`);
        localStorage.setItem('a320-briefing-size', String(size));
        document.querySelector('#reset').textContent = `${size}`;
        document.querySelector('#reset').setAttribute('aria-label', `Text size ${size} pixels; reset to default`);
      };
      document.querySelector('#smaller').addEventListener('click', () => setSize(size - 1));
      document.querySelector('#larger').addEventListener('click', () => setSize(size + 1));
      document.querySelector('#reset').addEventListener('click', () => setSize(defaultSize));
      setSize(size);

      const status = document.querySelector('#save-status');
      document.querySelectorAll('[data-save]').forEach(field => {
        const key = `a320-briefing-${field.dataset.save}`;
        const stored = localStorage.getItem(key);
        if (stored !== null) {
          if (field.type === 'checkbox') field.checked = stored === 'true';
          else field.value = stored;
        }
        const save = () => {
          localStorage.setItem(key, field.type === 'checkbox' ? String(field.checked) : field.value);
          status.textContent = 'Saved on this device.';
        };
        field.addEventListener(field.type === 'checkbox' ? 'change' : 'input', save);
      });
    </script>
  </body>
</html>
